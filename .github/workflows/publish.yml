name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # no registry-url: setup-node would write a placeholder auth token
      # into .npmrc and npm would skip the OIDC exchange
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish
